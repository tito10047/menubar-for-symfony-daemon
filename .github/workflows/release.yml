name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        # The default token is read-only here, so creating the release fails
        # after a green build without this.
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Not `npm ci`: package-lock.json is deliberately not tracked, and
            # every dependency here is a build-time dev dependency — the shipped
            # bundle has no runtime dependencies at all.
            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            # gjs and a session bus are needed for the end-to-end test, which is
            # the only place the exported D-Bus interface is exercised.
            - name: Install GJS and dbus
              run: sudo apt-get update && sudo apt-get install -y gjs dbus

            # The end-to-end test drives the real CLI; without it the daemon
            # answers CliNotFound and two thirds of the suite fails.
            - name: Install the Symfony CLI
              run: |
                  curl -sS https://get.symfony.com/cli/installer | bash
                  echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"

            - name: D-Bus end-to-end test
              run: npm run test:dbus

            # The tarball is flat on purpose: unpack, run ./install.sh, done.
            - name: Package
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  NAME="menubar-for-symfony-daemon-${VERSION}"
                  DIR="$RUNNER_TEMP/$NAME"

                  mkdir -p "$DIR"
                  cp dist/menubar-for-symfony-daemon.js "$DIR/"
                  cp install.sh uninstall.sh README.md LICENSE "$DIR/"
                  tar -czf "$GITHUB_WORKSPACE/${NAME}.tar.gz" -C "$RUNNER_TEMP" "$NAME"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: '*.tar.gz'

name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            # gjs and a session bus are needed for the end-to-end test, which is
            # the only place the exported D-Bus interface is exercised.
            - name: Install GJS and dbus
              run: sudo apt-get update && sudo apt-get install -y gjs dbus

            - name: D-Bus end-to-end test
              run: npm run test:dbus

            # The tarball is flat on purpose: unpack, run ./install.sh, done.
            - name: Package
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  NAME="menubar-for-symfony-daemon-${VERSION}"
                  DIR="$RUNNER_TEMP/$NAME"

                  mkdir -p "$DIR"
                  cp dist/menubar-for-symfony-daemon.js "$DIR/"
                  cp install.sh uninstall.sh README.md LICENSE "$DIR/"
                  tar -czf "$GITHUB_WORKSPACE/${NAME}.tar.gz" -C "$RUNNER_TEMP" "$NAME"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: '*.tar.gz'
